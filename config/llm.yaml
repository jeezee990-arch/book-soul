version: 1

# LLM Provider 配置
# 注意：本文件不含真 key；api_key_env 指向 .env 里的变量名
# 切换默认 provider：改 default_provider
# 切换场景默认：改 routing.<场景>
#
# ⚠️ 模型名会以服务端实际支持为准。2026-10-22 实测 mimo 的 /models 接口：
#    v2.5 系列只有 asr / tts（语音），**没有 chat 模型**；
#    chat 只有 v2.6 系列。写死 mimo-v2.5-pro 会让生成直接 400。

providers:
  # MiMo (Xiaomi 国内节点，默认) - 兼容 OpenAI Chat Completions
  mimo:
    type: openai_compat
    base_url: https://api.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
    default_model: mimo-v2.6-pro
    # 国内节点响应快（< 5s），30s timeout + 2 retry 足够
    timeout_seconds: 30
    max_retries: 2
    # 流式专用：read = 两个 chunk 之间的最大间隔（推理模型思考久不会误杀）
    stream_read_timeout: 120
    # 流式专用：整条流的总时长上限（防对端挂死）
    stream_total_timeout: 600
    # 已知可用的 chat 模型（2026-10-22 实测确认）
    models: [mimo-v2.6-pro, mimo-v2.6-pro-ultraspeed, mimo-v2.6-flash]
    # 用户自填的未知模型按这组能力值兜底（避免"没登记规格就发不出章节"）
    default_context_window: 128000
    default_max_output_tokens: 16384
    # 推理模型思考预算（token，2026-10-25 新增）
    #
    # 为什么需要：思考内容同样计入 max_tokens 额度。业务层给的 max_tokens
    # 语义是"**正文**预算"，实际请求 = 正文预算 + 思考预算。
    # 少了这一项，剧情场景（正文预算 2048）会被思考吃光 → "version N empty"。
    reasoning_token_overhead: 4096
    model_specs:
      mimo-v2.6-pro:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: premium
      mimo-v2.6-pro-ultraspeed:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: premium
      mimo-v2.6-flash:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: standard

  minimax:
    type: openai_compat        # 走 OpenAI 兼容协议（海外节点，需 VPN）
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    default_model: MiniMax-M3
    # Phase 3.4 修：60s × 3 retry = 180s 远超 Rust 120s timeout
    # 30s 足够海外节点正常响应（5-15s），2 retry 总等待 ≤ 60s
    timeout_seconds: 30
    max_retries: 2
    stream_read_timeout: 180
    stream_total_timeout: 900
    # 已知可用（2026-10-22 实测确认）
    models:
      - MiniMax-M3.1-Flash
      - MiniMax-M3
      - MiniMax-M2.7
      - MiniMax-M2.7-highspeed
      - MiniMax-M2.5
      - MiniMax-M2.5-highspeed
      - MiniMax-M2.1
      - MiniMax-M2.1-highspeed
      - MiniMax-M2
    default_context_window: 200000
    default_max_output_tokens: 16384
    # 推理模型思考预算（token，2026-10-25 新增）
    #
    # ⚠️ MiniMax-M3 系列的思考内容走 `delta.reasoning_content`，**同样计入
    #    max_tokens 额度**。2026-10-25 实测：一次响应里 172/195 个片段是思考
    #    （3180 字符），正文只有 21 个片段（404 字符）。
    #    剧情场景正文预算是 2048 —— 光思考就超了 → 正文为空 → "version N empty"。
    #    给足 8192 的思考预算后实际发 10240，思考 3000 + 正文 500 绰绰有余。
    reasoning_token_overhead: 8192
    model_specs:
      MiniMax-M3:
        context_window: 1000000      # 1M tokens（开发期辅助模型）
        max_output_tokens: 64000
        supports_chapter_range: true
        quality_tier: premium
      MiniMax-M3.1-Flash:
        context_window: 200000
        max_output_tokens: 32000
        supports_chapter_range: true
        quality_tier: premium
      MiniMax-M2.7:
        context_window: 200000
        max_output_tokens: 32000
        supports_chapter_range: true
        quality_tier: standard
      MiniMax-M2.5:
        context_window: 200000
        max_output_tokens: 32000
        supports_chapter_range: true
        quality_tier: standard
      MiniMax-M2.1:
        context_window: 200000
        max_output_tokens: 16000
        supports_chapter_range: true
        quality_tier: standard
      MiniMax-M2:
        context_window: 200000
        max_output_tokens: 16000
        supports_chapter_range: true
        quality_tier: standard

  openai:
    type: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    timeout_seconds: 30
    max_retries: 2
    stream_read_timeout: 120
    stream_total_timeout: 600
    models: [gpt-4o-mini, gpt-4o]
    default_context_window: 128000
    default_max_output_tokens: 8192
    model_specs:
      gpt-4o-mini:
        context_window: 128000
        max_output_tokens: 16384
        supports_chapter_range: true
        quality_tier: standard
      gpt-4o:
        context_window: 128000
        max_output_tokens: 4096
        supports_chapter_range: true
        quality_tier: premium

  ollama:
    type: ollama               # 走 Ollama /v1 兼容协议
    # ⚠️ 用 127.0.0.1 而不是 localhost（2026-10-24 实测）：
    #    Windows 上 localhost 通常**先解析成 ::1**，而 Ollama 默认只监听 IPv4
    #    → httpx 先连 ::1 秒失败，再等 **250ms**（happy eyeballs 间隔）才试 IPv4。
    #    这 250ms 纯浪费，而且每次新建连接都要重来一次。
    base_url: http://127.0.0.1:11434/v1
    api_key_env: ""            # 本地无需 key
    default_model: qwen2.5:14b
    timeout_seconds: 120
    max_retries: 1
    stream_read_timeout: 300
    stream_total_timeout: 1800
    models: [qwen2.5:14b, qwen2.5:7b, llama3.1:8b]
    default_context_window: 128000
    default_max_output_tokens: 16384
    # 本地 qwen3 / gpt-oss 这类模型带思考模式，留一点预算
    reasoning_token_overhead: 2048
    model_specs:
      qwen2.5:14b:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: local
      qwen2.5:7b:
        context_window: 32768
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: local
      llama3.1:8b:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: local

# 默认 provider（国内 MiMo，免 VPN）—— 用户没在设置页选过时用它
default_provider: mimo

# 章节硬限（来自 AGENTS.md 安全规范 + JEE 决策）
chapter_limits:
  min_chars: 1000
  max_chars: 8000
  min_context_needed: 32000       # 低于此 context_window 不允许生成章节

# 场景级输出上限（防"模型超写"）
#
# 为什么要这个：模型的 max_output_tokens 通常是 8192（章节要长），
# 但"简要剧情"只要 200-400 字。模型偶尔会写飞（上千字），
# 那就是**白等**——生成速度直接和输出长度成正比。
#
# 这里给剧情场景单独设一个上限：正常输出（400 字左右）远够用，
# 只有超写时才会被截断 → 宁可短一点也别让用户干等。
#
# ⚠️ 调太紧会把正文截断在半句上，所以别低于 1024。
scene_limits:
  plot_generation:
    max_tokens: 2048

# 场景路由：每个业务场景用哪个 provider
#
# "@settings" = 跟随设置页的选择（用户在设置页选了 minimax，创作就真的用 minimax）
# 写死具体 provider 名 = 该场景强制用那个
#   例：本机跑了 Ollama，想让质检走本地不花钱 → 把 quality_check 改成 ollama
#
# 2026-10-22 改：原先全部写死 mimo，导致"设置页选了 minimax 也没用"；
# 质检类场景写死 ollama，导致没装 Ollama 的机器质检直接失败。
routing:
  inspiration: "@settings"
  plot_generation: "@settings"
  outline_complete: "@settings"
  outline_semi_open: "@settings"
  outline_freedom: "@settings"
  character_generation: "@settings"
  chapter_generation: "@settings"
  chapter_rewrite: "@settings"
  quality_check: "@settings"
  summarize: "@settings"
  quality_writing: "@settings"
  quality_logic: "@settings"
  quality_pacing: "@settings"
  quality_consistency: "@settings"
  quality_genre: "@settings"
