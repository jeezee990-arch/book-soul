version: 1

# LLM Provider 配置
# 注意：本文件不含真 key；api_key_env 指向 .env 里的变量名
# 切换默认 provider：改 default_provider
# 切换场景默认：改 routing.<场景>

providers:
  # MiMo (Xiaomi 国内节点，默认) - 兼容 OpenAI Chat Completions
  mimo:
    type: openai_compat
    base_url: https://api.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
    default_model: mimo-v2.5-pro
    # 国内节点响应快（< 5s），30s timeout + 2 retry 足够
    timeout_seconds: 30
    max_retries: 2
    models: [mimo-v2.5-pro]
    model_specs:
      mimo-v2.5-pro:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: standard

  minimax:
    type: openai_compat        # 走 OpenAI 兼容协议（海外节点，需 VPN）
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    default_model: MiniMax-M3
    # Phase 3.4 修：60s × 3 retry = 180s 远超 Rust 120s timeout
    # 30s 足够海外节点正常响应（5-15s），2 retry 总等待 ≤ 60s
    timeout_seconds: 30
    max_retries: 2
    models: [MiniMax-M3]
    model_specs:
      MiniMax-M3:
        context_window: 1000000      # 1M tokens（开发期辅助模型）
        max_output_tokens: 64000
        supports_chapter_range: true
        quality_tier: premium

  openai:
    type: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    timeout_seconds: 30
    max_retries: 2
    models: [gpt-4o-mini, gpt-4o]
    model_specs:
      gpt-4o-mini:
        context_window: 128000
        max_output_tokens: 16384
        supports_chapter_range: true
        quality_tier: standard
      gpt-4o:
        context_window: 128000
        max_output_tokens: 4096
        supports_chapter_range: true
        quality_tier: premium

  ollama:
    type: ollama               # 走 Ollama /v1 兼容协议
    base_url: http://localhost:11434/v1
    api_key_env: ""            # 本地无需 key
    default_model: qwen2.5:14b
    timeout_seconds: 120
    max_retries: 1
    models: [qwen2.5:14b, qwen2.5:7b, llama3.1:8b]
    model_specs:
      qwen2.5:14b:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: local
      qwen2.5:7b:
        context_window: 32768
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: local
      llama3.1:8b:
        context_window: 128000
        max_output_tokens: 8192
        supports_chapter_range: true
        quality_tier: local

# 默认 provider（国内 MiMo，免 VPN）
default_provider: mimo

# 章节硬限（来自 AGENTS.md 安全规范 + JEE 决策）
chapter_limits:
  min_chars: 1000
  max_chars: 8000
  min_context_needed: 32000       # 低于此 context_window 不允许生成章节

# 场景路由：每个业务场景用哪个 provider
# Phase 3.4+ 改：默认全部走 mimo（国内快），quality_* 仍走 ollama（本地，不依赖网络）
routing:
  inspiration: mimo
  plot_generation: mimo
  outline_complete: mimo
  outline_freedom: mimo
  character_generation: mimo
  chapter_generation: mimo
  chapter_rewrite: mimo
  quality_check: ollama
  summarize: ollama
  quality_writing: ollama
  quality_logic: ollama
  quality_pacing: ollama
  quality_consistency: ollama
  quality_genre: ollama
