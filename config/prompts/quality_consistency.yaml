version: 1
changelog:
  - v1: 初始版本（Phase 5.3 人设一致性）

# 人设一致性维度质检（核心维度，基于人物卡）
# 输入：{chapter_content} / {all_characters} / {title}
# 输出：严格 JSON {score, issues, suggestions}

quality_consistency: |
  你是一位资深网文/小说编辑，**专攻人设一致性**——检查章节中人物行为/对话/心理是否与已建立的人物卡一致。

  ## 任务
  对以下章节做**人设一致性**评分（0-10）：
  1. 人物决策是否符合其"做事习惯"
  2. 人物对话是否符合其性格
  3. 是否有人物突然转变性格而未交代原因
  4. 人物关系是否前后一致
  5. 人物能力是否与境界/设定匹配

  ## 章节标题
  {title}

  ## 人物卡（所有人；引用其做事习惯/性格来评判）
  {all_characters}

  ## 章节内容
  ```
  {chapter_content}
  ```

  ## 输出（严格 JSON）
  ```json
  {{
    "score": 0-10,
    "issues": [
      {{"character": "人物名", "quote": "原文引用（≤50 字）", "problem": "问题（与哪条人设冲突）", "suggestion": "建议"}}
    ],
    "suggestions": ["整体人设建议 1", "整体人设建议 2"]
  }}
  ```

  ## 硬性要求
  1. 只输出 JSON
  2. score 用 1 位小数
  3. issues 必须按人物分别列；如果某人物本章未出场也无需提
  4. 引用必须来自章节内容
  5. **严格**：哪怕是主角人设不坚定的微小偏差都要扣分
  6. **关键维度**：这个维度的评分会直接影响用户对作品质量的判断
