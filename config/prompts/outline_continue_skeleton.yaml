version: 1
changelog:
  - v1: 初始版本（AI 辅助续写大纲 · 骨架阶段）

# 大纲续写：骨架阶段
# 输入：{genre} / {plot} / {keywords} / {existing_context} / {written_context} /
#       {last_volume_name} / {volume_count} / {chapters_per_volume} /
#       {words_per_chapter} / {user_extra}
# 输出：严格 JSON（**新增**的卷，volumes[].chapters[].title）
#
# 与 outline_skeleton.yaml 的区别
# -------------------------------
# 续写不是"从零规划"，必须**接着已有故事往下写**：
# - 已有卷名/卷概要 → 让新卷自然承接
# - 已写章节的标题与内容摘要 → 让剧情跟得上作者已经写到的位置
# - 卷编号从 {last_volume_name} 之后继续
prompt: |
  你是一位网文/小说创作助手。现在要为一本**已经有大纲、也已经写了一部分**的小说**续写后续卷章**。

  ## 背景
  - 题材：{genre}
  - 全书简要剧情：
  ```
  {plot}
  ```
  - 强调的关键词：{keywords}

  ## 已有大纲（**必须承接，不要重写**）
  ```
  {existing_context}
  ```

  ## 作者已经写完的章节（**后续剧情要跟这里接得上**）
  ```
  {written_context}
  ```

  ## 任务
  接着上面的进度，续写 **{volume_count} 卷**，每卷 **{chapters_per_volume} 章**，
  共 **{volume_count} × {chapters_per_volume} 章**，每章预计 **{words_per_chapter} 字**。

  - 新卷的编号紧接在「{last_volume_name}」之后
  - 剧情要**无缝衔接**作者已写到的位置：人物状态、悬念、伏笔都要接得上
  - 只能往前推进，不能推翻已有设定

  ## 输出格式（严格 JSON，不要其他内容）
  ```json
  {{
    "volumes": [
      {{
        "name": "续写卷名（20字内，编号接在已有卷之后）",
        "summary": "本卷一句话概括（80-150字）",
        "chapters": [
          {{"title": "章节标题（20字内）"}}
        ]
      }}
    ],
    "overall_theme": "全篇主题一句话（20-50字）"
  }}
  ```

  ## 硬性要求
  1. **只输出 JSON**，不要"以下是..."等任何前缀文字
  2. 只输出**新增**的卷，不要把已有卷重复输出一遍
  3. 章数**严格等于** {volume_count} × {chapters_per_volume} 章
  4. 不要修改已有卷的设定；新卷要与已有卷形成递进关系
  5. **这一阶段只写章节标题**，章概要和关键事件留到下一步逐卷补充

  ## 作者特别要求（作为内容参考）
  {user_extra}
