version: 1
changelog:
  - v1: 初始版本（两阶段大纲 · 阶段一：卷章骨架）

# 大纲阶段一：卷章骨架
# 输入：{genre} / {plot} / {keywords} / {total_chapters} / {volume_count} /
#       {volume_plan} / {words_per_chapter} / {mode_block} / {user_extra}
# 输出：严格 JSON（volumes[].chapters[].title），**不含章概要 / key_events**
#
# 为什么分两阶段（2026-10-25）
# -----------------------------
# 旧做法是**一次**让模型输出完整大纲（卷 + 章 + 概要 + 关键事件）。
# 实测 30 章的大纲要 300 秒：推理模型思考 135 秒 + 一次吐 1.2 万 token 165 秒。
#
# 现在拆成：
# - 阶段一（本模板）：只规划**卷 + 章标题**。输出量小 → 快，用户几十秒就能看到全书骨架。
# - 阶段二（outline_volume_detail.yaml）：每卷**并行**补章概要与关键事件。
#
# 好处：① 用户几十秒就能看到全书结构；② 各卷并行，总耗时大幅下降。
prompt: |
  你是一位网文/小说创作助手。现在要为一本书规划**分卷与章节骨架**。

  ## 任务
  根据以下【题材】与【简要剧情】，规划全书骨架。
  - 题材：{genre}
  - 简要剧情：
  ```
  {plot}
  ```
  - 强调的关键词：{keywords}

  ## 规模要求（**硬指标，必须严格执行**）
  - 全书共 **{volume_count} 卷**
  - 每卷章数安排：{volume_plan}
  - 总计 **{total_chapters} 章**
  - 每章预计 **{words_per_chapter} 字**

  章节总数必须**刚好等于 {total_chapters} 章**，不要多也不要少。
  {mode_block}

  ## 输出格式（严格 JSON，不要其他内容）
  ```json
  {{
    "volumes": [
      {{
        "name": "第一卷 ...（20字内）",
        "summary": "本卷一句话概括（80-150字）",
        "chapters": [
          {{"title": "第一章 ...（20字内）"}}
        ]
      }}
    ],
    "overall_theme": "全篇主题一句话（20-50字）"
  }}
  ```

  ## 硬性要求
  1. **只输出 JSON**，不要"以下是..."等任何前缀文字
  2. 章数**严格等于** {total_chapters} —— 这是硬指标，模型必须照做
  3. 每卷章数**严格按上面的分卷安排**
  4. 章节顺序：起承转合清晰，冲突/高潮分布合理
  5. 卷与卷之间有**递进/转折**关系（避免重复套路）
  6. 符合该题材的常见结构（修仙：从炼气到飞升；都市：从草根到巅峰；悬疑：铺垫-揭秘-反转）
  7. **这一阶段只写章节标题**，章概要和关键事件留到下一步逐卷补充
  8. **全程用中文思考与写作**：规划、推演都在中文里完成，思考里不要出现
     英文单词、代码、英文缩写（最终输出是 JSON，格式要求除外）

  ## 作者特别要求（作为**内容**参考；规模一律以上面的硬指标为准）
  {user_extra}
