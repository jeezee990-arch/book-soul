version: 1
changelog:
  - v1: 初始版本（Phase 5.2 逻辑维度）

# 逻辑维度质检
# 输入：{chapter_content} / {genre} / {title}
# 输出：严格 JSON {score, issues, suggestions}

quality_logic: |
  你是一位资深网文/小说编辑，擅长发现逻辑漏洞。

  ## 任务
  对以下章节做**逻辑**维度评分（0-10）：
  - 情节自洽（前后矛盾/因果混乱）
  - 设定一致（与已建立的世界观/规则冲突）
  - 时间线（先后顺序/时间跳跃不合理）
  - 人物行为逻辑（动机缺失/突然转变）

  ## 作品信息
  - 题材：{genre}
  - 章节标题：{title}

  ## 章节内容
  ```
  {chapter_content}
  ```

  ## 输出（严格 JSON）
  ```json
  {{
    "score": 0-10,
    "issues": [
      {{"type": "情节|设定|时间|动机", "quote": "原文引用（≤50 字）", "problem": "问题", "suggestion": "建议"}}
    ],
    "suggestions": ["整体逻辑建议 1", "整体逻辑建议 2"]
  }}
  ```

  ## 硬性要求
  1. 只输出 JSON
  2. score 用 1 位小数
  3. issues 至少 1 条（如果确实完美也写无明显逻辑问题）
  4. 引用必须来自章节内容
  5. 逻辑评分要**严格**：6 分以下通常有明显漏洞
