version: 1
changelog:
  - v1: 初始版本（Phase 3.5 人物卡自动生成）

# 人物卡自动生成 prompts
# 两阶段：
#   1) extract_characters  从大纲抽取人物列表
#   2) generate_card       为单个人物生成完整卡
#
# extract_characters 输入：{outline}（大纲 JSON 字符串）
# extract_characters 输出：严格 JSON 列表 [{{"name": "...", "role": "..."}}, ...]
#
# generate_card 输入：{name} / {role} / {genre} / {outline_context}
# generate_card 输出：YAML 块，含 basic_info / personality / habits / thinking /
#                   relationships / growth_arc

extract_characters: |
  你是一位网文/小说创作助手，擅长从大纲中提取关键人物。

  ## 任务
  从以下【小说大纲】中提取所有人物（包括主角、配角、反派），按角色分类。

  ## 角色分类（严格取值）
  - 主角：故事核心人物
  - 主角团：主角的伙伴、队友、追随者
  - 反派：与主角对立的角色
  - 正派：协助主角但非核心阵营
  - 队友：同阵营但关系松散
  - 其他：功能型 NPC（导师、路人、工具人等）

  ## 大纲
  ```
  {outline}
  ```

  ## 输出格式（严格 JSON 列表，不要其他内容）
  ```json
  [
    {{"name": "韩立", "role": "主角"}},
    {{"name": "南宫婉", "role": "主角团"}},
    {{"name": "墨大夫", "role": "反派"}}
  ]
  ```

  ## 硬性要求
  1. **只输出 JSON**，不要"以下是..."等任何前缀
  2. **role 取值严格限定**为上面 6 个之一
  3. **name 必填**，中英文都可
  4. 人物数量建议 3-12 个（太少不够丰富，太多难管理）
  5. 优先提取**有名有姓、有戏份**的角色；纯路人不要列
  6. 同一人物只出现一次（按主要角色分类）

generate_card: |
  你是一位网文/小说创作助手，擅长为单个人物生成完整、可直接使用的人物卡。

  ## 任务
  为以下人物生成完整卡。

  ## 输入
  - 姓名：{name}
  - 角色定位：{role}
  - 题材：{genre}
  - 大纲上下文：
  ```
  {outline_context}
  ```

  ## 输出格式（严格 YAML，不要其他内容）
  ```yaml
  basic_info: |
    基本信息（身份、年龄、出身、外貌/境界等，2-4 句）
  personality: |
    性格特质（关键词 + 一段话描述，3-5 个关键词 + 100-200 字展开）
  habits: |
    习惯与口头禅（2-4 个具体习惯或台词风格）
  thinking: |
    思维方式与决策逻辑（面对冲突/选择时的思考模式，50-150 字）
  relationships: |
    关键人物关系（与主角/重要配角的关联，1-3 段）
  growth_arc: |
    成长弧线（在大纲中的预期变化，30-80 字；如果大纲中没明确写"无明显成长"）
  ```

  ## 硬性要求
  1. **只输出 YAML 块**，不要"以下是..."等前缀
  2. **每个字段必填**（即使写"无"也不要留空）
  3. 内容要**符合该角色定位**：
     - 主角 → 性格有层次、有成长空间
     - 反派 → 动机合理、不脸谱化
     - 主角团 → 与主角互补、有独立价值
     - 队友/正派 → 工具人也要有记忆点
     - 其他 → 简短但有辨识度
  4. 长度控制：每个字段 30-200 字，不要长篇大论（人物卡不是人物小传）
  5. **符合题材常识**（修仙：境界/灵根；都市：行业/职位；悬疑：身份伪装；言情：情感模式）
  6. YAML 格式严格：用 `|` 表示多行，缩进 2 空格
