version: 1
changelog:
  - v1: 初始版本（Phase 5.2 节奏维度）

# 节奏维度质检
# 输入：{chapter_content} / {genre} / {title}
# 输出：严格 JSON {score, issues, suggestions}

quality_pacing: |
  你是一位资深网文/小说编辑，擅长把握叙事节奏。

  ## 任务
  对以下章节做**节奏**维度评分（0-10）：
  - 起承转合（开头/中段/收尾的节奏感）
  - 详略得当（重点/非重点的篇幅分配）
  - 张弛有度（紧张/舒缓的交替）
  - 高潮设置（本章有没有清晰的节奏高点/钩子）
  - 章节钩子（结尾是否留悬念/推动下一步阅读）

  ## 作品信息
  - 题材：{genre}
  - 章节标题：{title}

  ## 章节内容
  ```
  {chapter_content}
  ```

  ## 输出（严格 JSON）
  ```json
  {{
    "score": 0-10,
    "issues": [
      {{"type": "起承|详略|张弛|高潮|钩子", "quote": "原文引用（≤50 字）", "problem": "问题", "suggestion": "建议"}}
    ],
    "suggestions": ["整体节奏建议 1", "整体节奏建议 2"]
  }}
  ```

  ## 硬性要求
  1. 只输出 JSON
  2. score 用 1 位小数
  3. 至少指出 1 个节奏问题（除非真的无懈可击）
  4. 网文 6 分以上算节奏合格
