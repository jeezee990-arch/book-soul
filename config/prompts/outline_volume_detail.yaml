version: 1
changelog:
  - v1: 初始版本（两阶段大纲 · 阶段二：单卷细节）

# 大纲阶段二：单卷细节
# 输入：{genre} / {plot} / {volume_index} / {volume_count} / {volume_name} /
#       {volume_summary} / {chapters_json} / {words_per_chapter}
# 输出：严格 JSON（chapters[].summary + chapters[].key_events），**与 chapters_json 按下标对齐**
#
# 为什么单独一个模板
# ------------------
# 阶段一只出卷名 + 章标题；概要和关键事件按**卷**并行补。
# 每卷一次调用 → 输出量小 → 快；各卷并行 → 总耗时 ≈ 最慢的那一卷，而不是各卷之和。
#
# ⚠️ 输出必须与输入的 chapters_json **同序同长**（前端按下标合并）。
prompt: |
  你是一位网文/小说创作助手。现在要为一本小说的**其中一卷**补充章节细节。

  ## 背景
  - 题材：{genre}
  - 全书简要剧情：
  ```
  {plot}
  ```
  - 这是第 {volume_index} 卷（共 {volume_count} 卷）
  - 本卷名称：{volume_name}
  - 本卷概要：{volume_summary}
  - 每章预计 {words_per_chapter} 字

  ## 本卷已有的章节骨架（**顺序与数量不可改动**）
  ```
  {chapters_json}
  ```

  ## 本次范围
  {batch_hint} —— 只处理上面列出的这 {chapters_json} 里的章节，不要提及其他章节。

  ## 任务
  为上面**每一个**章节补写：一句本章概要 + 2-4 个关键事件。

  ## 输出格式（严格 JSON，不要其他内容）
  ```json
  {{
    "chapters": [
      {{"summary": "本章一句话概括（40-80字）", "key_events": ["关键事件1", "关键事件2"]}}
    ]
  }}
  ```

  ## 硬性要求
  1. **只输出 JSON**，不要"以下是..."等任何前缀文字
  2. ``chapters`` 数组的长度必须与上面章节骨架**完全一致**，顺序也必须一致
  3. 不要修改、重写章节标题 —— 标题已定，你只补概要和关键事件
  4. 概要要体现"起承转合"在本章的位置，不要空洞形容
  5. 关键事件要是**具体动作/事件**（"夜袭"、"拜入宗门"、"灵根测试"），不要写"感情升温"这种空话
  6. 关键事件要与本卷概要、简要剧情保持一致，不要引入无关支线
  7. **全程用中文思考与写作**：构思每章概要时用中文，思考里不要出现
     英文单词、代码、英文缩写（最终输出是 JSON，格式要求除外）
