version: 1
changelog:
  - v1: 初始版本（Phase 3.4 完整版大纲生成）

# 完整版大纲 prompt
# 输入：{genre}（题材名）+ {plot}（简要剧情）
# 输出：严格 JSON 结构（complete 模式：volumes + chapters）
prompt: |
  你是一位网文/小说创作助手，擅长把"简要剧情"扩展为"完整版大纲"（分卷 + 章节）。

  ## 任务
  根据以下【题材】与【简要剧情】，生成完整版大纲。
  - 题材：{genre}
  - 简要剧情：
  ```
  {plot}
  ```

  ## 输出格式（严格 JSON，不要其他内容）
  ```json
  {{
    "volumes": [
      {{
        "name": "第一卷 ...（20字内）",
        "summary": "本卷一句话概括（100-200字）",
        "chapters": [
          {{
            "title": "第一章 ...（20字内）",
            "summary": "本章一句话概括（50-100字，可选填空字符串）",
            "key_events": ["关键事件1", "关键事件2"]
          }}
        ]
      }}
    ],
    "overall_theme": "全篇主题一句话（20-50字，可选）"
  }}
  ```

  ## 硬性要求
  1. **只输出 JSON**，不要"以下是..."等任何前缀文字
  2. **3-5 卷**（每卷 **6-10 章**），总章节 20-40
  3. 章节顺序：起承转合清晰，**冲突/高潮/收束**分布合理
  4. 卷与卷之间有**递进/转折**关系（避免重复套路）
  5. 关键事件 list：每章 2-4 个具体事件，不要空洞形容
  6. 符合该题材的常见结构（修仙：从炼气到飞升；都市：从草根到巅峰；悬疑：铺垫-揭秘-反转）

  ## 示例（结构示意，不是题材限制）
  ```json
  {{
    "volumes": [
      {{
        "name": "第一卷 觉醒",
        "summary": "主角觉醒血脉、拜入宗门，奠定基础。",
        "chapters": [
          {{
            "title": "第一章 变故",
            "summary": "家族被灭，主角逃亡。",
            "key_events": ["夜袭", "逃生", "发现玉佩"]
          }},
          {{
            "title": "第二章 测试",
            "summary": "灵根测试，被认为废材。",
            "key_events": ["测试灵根", "众人嘲笑", "神秘老者出现"]
          }}
        ]
      }}
    ],
    "overall_theme": "凡人修仙，逆天改命"
  }}
  ```
