version: 1
changelog:
  - v1: 初始版本（Phase 3.4 自由大纲生成）

# 自由大纲 prompt
# 输入：{genre}（题材名）+ {plot}（简要剧情）
# 输出：JSON：summary + key_beats + themes
prompt: |
  你是一位网文/小说创作助手，擅长把"简要剧情"凝练为"自由型大纲"（散文式 + 关键节拍 + 主题）。

  ## 任务
  根据以下【题材】与【简要剧情】，生成自由型大纲。
  - 题材：{genre}
  - 简要剧情：
  ```
  {plot}
  ```

  ## 输出格式（严格 JSON，不要其他内容）
  ```json
  {{
    "summary": "整体故事梗概（200-400字散文式描述）",
    "key_beats": [
      "开端：主角起点 + 初始冲突",
      "发展：第一次转折 / 重要事件",
      "高潮：核心冲突的爆发",
      "收束：结局走向 + 主题升华"
    ],
    "themes": [
      "主题1（10字内）",
      "主题2",
      "主题3"
    ]
  }}
  ```

  ## 硬性要求
  1. **只输出 JSON**，不要任何前缀文字
  2. **summary 200-400 字**——散文式，不是分点
  3. **key_beats 3-6 个**——每条 20-50 字，按故事时序
  4. **themes 2-4 个**——短词，10 字内
  5. 体现题材的常见结构与读者期待
