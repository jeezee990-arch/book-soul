name: 悬疑
description: |
  以悬念、推理、揭秘为核心的网文流派。注重逻辑链、伏笔回收、
  人物心理刻画与真相的多层反转。常见刑侦、灵异、盗墓、密室、
  历史悬案、社会派推理等子流派。

tropes:
  - 密室杀人
  - 完美犯罪
  - 失忆侦探
  - 双胞胎身份
  - 心理侧写
  - 冤案平反
  - 盗墓探险
  - 灵异事件
  - 时间循环
  - 梦境探案
  - 凶手在身边
  - 童谣杀人
  - 暴风雪山庄
  - 叙述性诡计
  - 替身身份
  - 神秘日记
  - 老宅秘闻
  - 直播探案
  - 警局搭档
  - 私人侦探

cliches_to_avoid:
  - 主角无所不知一眼看穿
  - 反派智商下线只为被抓
  - 巧合推动剧情而非逻辑
  - 灵异事件全靠"精神病"解释
  - 推理过程跳过直接给答案
  - 人物动机模糊

reader_expectations:
  - 线索公平（读者可参与推理）
  - 伏笔前后呼应
  - 反转有铺垫不突兀
  - 人物心理有层次
  - 案件有现实基础
  - 节奏张弛有度

sub_genres:
  - 刑侦破案（重案组、刑警本色）
  - 灵异怪谈（深夜书屋、民间诡事）
  - 盗墓探险（鬼吹灯、盗墓笔记）
  - 历史悬案（民国、清末探案）
  - 心理悬疑（侧写师、犯罪心理）
  - 密室推理（暴风雪山庄、孤岛）
  - 社会派推理（东野圭吾风）
  - 直播探案（新媒体探案）
  - 科幻悬疑（时间循环、AI）
  - 校园悬疑（失踪、诅咒）

core_conflicts:
  - 真相 vs 谎言
  - 秩序 vs 犯罪
  - 记忆 vs 遗忘
  - 理性 vs 灵异
  - 复仇 vs 救赎
