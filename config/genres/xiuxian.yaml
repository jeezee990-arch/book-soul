name: 修仙
description: |
  网文最大流派，核心是修炼等级体系与飞升长生的浪漫想象。
  世界观以宗门、功法、灵根、灵气为核心；主角通过奇遇、传承、战斗
  不断突破境界，伴随正邪冲突与情感纠葛。

# 常见套路（写剧情/大纲时 AI 会参考）
tropes:
  - 废柴逆袭
  - 退婚打脸
  - 越级战斗
  - 宗门大比
  - 夺宝探险
  - 师徒传承
  - 双修奇遇
  - 灵根觉醒
  - 丹药品级
  - 灵兽契约
  - 飞升雷劫
  - 心魔试炼
  - 仙门大选
  - 血脉觉醒
  - 替身复仇
  - 失忆流落
  - 沉睡万年
  - 转世重修
  - 散修崛起
  - 神兽认主

# 需要避开的俗套
cliches_to_avoid:
  - 主角永远单挑必胜，无悬念
  - 反派为反而反，毫无动机
  - 女性角色全是恋爱工具人
  - 等级体系崩坏，境界随意突破
  - 主角光环过强，遇险必有人救
  - 丹药无限供应，失去稀缺感

# 读者期待
reader_expectations:
  - 等级体系清晰可量化（炼气→筑基→金丹→元婴→化神→炼虚→合体→大乘→渡劫）
  - 战斗场景有具体法术与法宝对撞
  - 升级反馈及时爽感强
  - 宗门势力有派系与立场
  - 女主/道侣戏份有分量
  - 反派智商在线，阴谋有层次

# 主流分支
sub_genres:
  - 古典仙侠（凡人修仙传、仙逆）
  - 修真文明（遮天、完美世界）
  - 洪荒流（佛本是道、洪荒之圣人门徒）
  - 仙武修真（结合武道）
  - 现代修仙（在都市修行）
  - 西游/封神同人

# 核心冲突原型
core_conflicts:
  - 个体长生 vs 天道无情
  - 散修自由 vs 宗门秩序
  - 正道大义 vs 个人私情
  - 修为飞升 vs 心境圆满
