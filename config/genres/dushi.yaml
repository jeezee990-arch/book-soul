name: 都市
description: |
  以现代城市为背景的网文主流。涵盖职场、商场、校园、官场、家族、
  异能等子流派。核心是阶层跃迁、权力博弈、情感纠葛与快节奏爽感。

tropes:
  - 草根崛起
  - 职场逆袭
  - 鉴宝捡漏
  - 战神归来
  - 龙王/修罗殿
  - 神医传承
  - 重生回到过去
  - 透视异能
  - 兵王回归
  - 豪门弃少
  - 闪婚总裁
  - 神豪系统
  - 鉴宝专家
  - 古玩捡漏
  - 同学会装逼
  - 强势女主
  - 创业发家
  - 科技大佬
  - 娱乐圈顶流
  - 直播带货

cliches_to_avoid:
  - 主角碾压一切，无对手
  - 美女无脑倒贴
  - 配角智商下线只为衬托
  - 装逼打脸套路化、机械重复
  - 财富数字无限膨胀无意义
  - 异能来源无解释

reader_expectations:
  - 现实逻辑自洽（部分世界观可玄幻）
  - 主角成长有阶段性
  - 女主/红颜有独立人格
  - 爽点密集不拖沓
  - 行业细节专业可信
  - 阶层冲突有真实感

sub_genres:
  - 都市职场（杜月笙、商战）
  - 都市异能（透视、鉴宝）
  - 都市修仙（在现代修行）
  - 都市兵王（特种兵回归）
  - 重生都市（回到过去）
  - 神豪流（系统/重生成首富）
  - 鉴宝流（古玩玉器）
  - 娱乐圈（明星、导演）
  - 校园都市（学霸、青春）
  - 官场仕途

core_conflicts:
  - 草根 vs 权贵阶层
  - 个人能力 vs 体制规则
  - 真情 vs 利益联姻
  - 现代理性 vs 神秘传承
