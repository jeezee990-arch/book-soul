name: 言情
description: |
  以情感为主线的网文流派。注重人物关系、情感张力、女性视角与
  浪漫想象。涵盖古代言情、现代言情、玄幻言情、校园、职场、宫廷等
  大量子流派，是女频核心。

tropes:
  - 替嫁冲喜
  - 契约婚姻
  - 霸道总裁
  - 穿越重生
  - 师徒虐恋
  - 青梅竹马
  - 欢喜冤家
  - 失忆遗忘
  - 错嫁王爷
  - 宫斗宅斗
  - 先婚后爱
  - 暗恋成真
  - 重生复仇
  - 兄妹反目
  - 闺蜜反目
  - 救赎之爱
  - 相爱相杀
  - 命中注定
  - 姐弟恋
  - 异国恋

cliches_to_avoid:
  - 男主只爱女主无理由
  - 女主全程傻白甜
  - 配角纯工具只为制造误会
  - 一胎多宝雷人设定
  - 误会拖几十章不解决
  - 完美无瑕的男主形象

reader_expectations:
  - 情感发展有铺垫不突兀
  - 男主/女主有独立人格
  - 配角副线丰富
  - 虐点与甜点平衡
  - 结局圆满或有意境
  - 女性角色立体不工具化

sub_genres:
  - 古代言情（宫斗、宅斗、穿越）
  - 现代言情（职场、豪门、校园）
  - 玄幻言情（修仙、仙侠恋爱）
  - 校园言情（学霸、青梅竹马）
  - 娱乐圈言情（明星恋爱）
  - 豪门世家（霸总、契约婚）
  - 重生言情（回到过去复仇）
  - 末世言情（生存中恋爱）
  - 西方言情（吸血鬼、狼人）
  - 民国言情（旗袍、十里洋场）

core_conflicts:
  - 真心 vs 利益
  - 自由恋爱 vs 包办婚姻
  - 门第差距 vs 真爱无敌
  - 复仇 vs 原谅
  - 个人幸福 vs 家族责任
