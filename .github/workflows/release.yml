name: Release

# 构建 Windows 安装包并发布到 GitHub Releases。
# 触发：推送 v* 标签；workflow_dispatch 只构建、不发布。
#
# 说明：Book Soul 目前是 Windows 桌面应用（Tauri NSIS + PyInstaller sidecar），
# 因此只跑 windows-latest。macOS / Linux 需要先为对应平台实现 sidecar，
# 不能直接复用 Windows 的 build_sidecar.ps1。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # 必须带 --extra dev：pytest / ruff / pyinstaller 都在 dev extra 里。
      - name: Install backend deps
        run: uv sync --all-packages --extra dev

      - name: Run backend tests
        run: uv run pytest
        working-directory: server

      - name: Run backend lint
        run: uv run ruff check .
        working-directory: server

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri 的 beforeBuildCommand 会调用 scripts/build_sidecar.ps1：
      # PyInstaller 打后端 exe → 拷到 src-tauri/binaries/ → 前端 vite build。
      - name: Build Tauri app
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: book-soul-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: book-soul-windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Book Soul ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
