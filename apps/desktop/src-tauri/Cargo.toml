[package]
name = "book-soul-desktop"
version = "0.1.1"
description = "Book Soul - AI 辅助小说写作桌面应用"
authors = ["JEE"]
edition = "2021"

# 库与二进制分离：lib 包含业务代码（移动端复用），main 只是个壳
[lib]
name = "book_soul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
# 本地时区时间戳（desktop.log）。chrono 已经作为 tauri 的传递依赖被链接进来，
# 显式声明只是为了让代码能直接用，不会额外增加产物体积。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 优化：release 编译体积
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
