[project]
name = "book-soul-server"
version = "0.1.1"
description = "Book Soul backend server (FastAPI)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "cryptography>=50.0.1",
    "keyring>=25.7.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # 打包 sidecar exe（Tauri 桌面版用）
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions/*", "tests/_smoke_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 Depends() 必须作为参数默认值使用，B008 在 api/ 目录下不适用
"src/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# ===== mypy =====
# 只检查 core/ + services/（业务逻辑集中处），暂不阻塞 CI。
# 理由：AI 辅助开发下最常见的低级错误就是参数名/字段名拼错，mypy 恰好能抓；
# 而第三方库缺 stub 造成的噪音，用范围限定压住。
[tool.mypy]
python_version = "3.11"
files = ["src/core", "src/services"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# 这些是"故意不标注"的，不报错
disallow_untyped_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# ===== coverage =====
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]
